x-term-llm:
  workspace: /workspace
  default_service: assistant
  agent: "{{name}}"
  shell: /bin/bash

services:
  assistant:
    image: {{personal_bot_image}}
    init: true
    restart: unless-stopped
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/run/personal-bot-bootstrap.sh"]
    env_file: [.env]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOME: /home/agent
      XDG_CONFIG_HOME: /home/agent/.config
      XDG_DATA_HOME: /home/agent/.local/share
      XDG_CACHE_HOME: /home/agent/.cache
    ports:
      - "127.0.0.1:${WEB_PORT}:8081"
    volumes:
      - home:/home/agent
      - workspace:/workspace
      - ./connection/term-llm:/run/personal-bot-connection:ro
      - ./bootstrap.sh:/run/personal-bot-bootstrap.sh:ro
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    labels:
      org.term-llm.contain: "true"
      org.term-llm.contain.name: "{{name}}"
      org.term-llm.contain.service: assistant
      org.term-llm.contain.user: agent

volumes:
  home:
  workspace:
